# docker-compose.yml - OpenAgentic SDK Worker 部署
services:
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    image: oa-worker:latest
    working_dir: /workspace
    container_name: oa-worker
    ports:
      - "${WORKER_PORT:-19000}:8765"
    volumes:
      - ${CODE_PATH:-..}:/workspace/repo:ro
      - worker-sessions:/tmp/sessions
      - worker-scratch:/tmp/scratch
    environment:
      - OA_REMOTE_NODE_NAME=${WORKER_NAME:-worker-0}
      - PYTHONPATH=/workspace/repo
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # LLM Provider 配置
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RIGHTCODE_API_KEY=${RIGHTCODE_API_KEY:-}
      - RIGHTCODE_BASE_URL=${RIGHTCODE_BASE_URL:-}
      # OpenTelemetry (可选)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=oa-worker-${WORKER_NAME:-worker-0}
    restart: unless-stopped
    command: >
      --host 0.0.0.0
      --port 8765
      --repo-root /workspace/repo
      --session-root /tmp/sessions
      --node-name ${WORKER_NAME:-worker-0}
      --remote-config /workspace/repo/deploy/docker/openagentic.remote.json
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  worker-sessions:
  worker-scratch:
